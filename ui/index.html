<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disha Console</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#18202f;--mute:#677189;--line:#e2e6ee;--acc:#3a5bd9;--acc2:#e9eefc;
--ok:#1c8a4f;--okbg:#e5f5ec;--warn:#a86200;--warnbg:#fff2dc;--bad:#c0392b;--badbg:#fde8e6;--bot:#eef2ff;--sel:#eef8ee;
--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--stage1:#0f1630;--stage2:#1b1446}
@media (prefers-color-scheme:dark){:root{--bg:#10131a;--panel:#171b24;--ink:#e6e9f0;--mute:#9aa3b6;--line:#272d3a;
--acc:#7d9bff;--acc2:#1e2740;--bot:#1b2440;--sel:#1a2a1d;--okbg:#14301f;--warnbg:#33260f;--badbg:#3a1b18}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 200deg,#6d5dfc,#3ab0ff,#6d5dfc);box-shadow:0 0 0 3px var(--acc2)}
header h1{font-size:16px;margin:0}header .sub{color:var(--mute);font-size:12px}header .right{margin-left:auto;font-size:12px;color:var(--mute);display:flex;align-items:center;gap:12px}
.flowbtn{font-weight:600;padding:6px 14px}
.insov{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.45);display:grid;place-items:center;padding:20px}.insov[hidden]{display:none}
.inspanel{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:min(1100px,100%);max-height:92vh;overflow:auto;padding:18px 20px}
.insh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.insh h2{margin:0;font-size:19px;margin-right:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--mute)}
.sugg{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--panel)}.sugg.approved{border-left-color:var(--ok)}.sugg.dismissed{opacity:.55;border-left-color:var(--mute)}
.sugg .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}.tag{font-size:11px;padding:1px 8px;border-radius:9px;background:var(--acc2);color:var(--acc)}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}
.learn{margin-top:12px;border:1px dashed var(--acc);border-radius:12px;padding:10px 12px;background:var(--acc2)}.learn h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.learn .chips{display:flex;gap:6px;flex-wrap:wrap}.learn small{color:var(--mute)}.fix{display:flex;gap:8px;align-items:baseline;margin:5px 0}.fix .tag{flex:none}
.flowov{position:fixed;inset:0;z-index:50;background:#0f1222}.flowov[hidden]{display:none}.flowov iframe{width:100%;height:100%;border:0;display:block}
.flowx{position:absolute;top:14px;right:18px;z-index:2;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.wrap{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 51px)}
aside.list{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
.tools{padding:10px;display:flex;gap:6px;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);z-index:1}
input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;font:inherit}
button:hover:not(:disabled){border-color:var(--acc)}button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default}button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.grp{padding:10px 12px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.s{display:flex;gap:10px;padding:9px 12px;cursor:pointer;border-left:3px solid transparent}.s:hover{background:var(--acc2)}
.s.on{background:var(--acc2);border-left-color:var(--acc)}.s b{display:block;font-weight:600}.s small{color:var(--mute)}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:var(--acc2);color:var(--acc);margin:2px 4px 0 0;white-space:nowrap}
.chip.SUPPRESS,.chip.ROUTE_TO_HUMAN{background:var(--badbg);color:var(--bad)}.chip.COOL_OFF_N_DAYS{background:var(--warnbg);color:var(--warn)}
.chip.OK_TO_CALL{background:var(--okbg);color:var(--ok)}
main{overflow:auto;padding:18px 22px}
.empty{color:var(--mute);margin-top:22vh;text-align:center}
.hero{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}.hero .av{width:48px;height:48px;font-size:18px}
.hero h2{margin:0;font-size:20px}.blockbox{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--bad);background:var(--badbg);color:var(--bad);font-size:13px;max-width:560px}
.blockbox label{display:block;margin-top:6px;color:var(--ink);font-size:12.5px}
.contact{display:flex;gap:6px;margin-top:8px;max-width:420px}.contact input{font-size:13px;padding:5px 8px}.hero .sub{color:var(--mute);font-size:13px}.hero .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin:16px 0 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--mute);padding:8px 12px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.tabs button .dot{display:none;width:7px;height:7px;border-radius:50%;background:#e5484d;margin-left:6px;vertical-align:1px;animation:blink 1.2s infinite}
.tabs button.liveon .dot{display:inline-block}
.pane{display:none;padding-top:14px}.pane.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:5px 12px}.kv>div:nth-child(odd){color:var(--mute)}
pre{font:12px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;margin:0;max-height:460px;overflow:auto}
details summary{cursor:pointer;color:var(--mute)}
.opening{font-size:16px;padding:12px 14px;background:var(--bot);border-radius:10px}
.bar{display:grid;grid-template-columns:160px 1fr 60px;align-items:center;gap:10px;margin:6px 0}.bar span{color:var(--mute)}
.bar .tr{height:9px;background:var(--line);border-radius:5px;overflow:hidden}.bar .tr i{display:block;height:100%;background:linear-gradient(90deg,#6d5dfc,#3ab0ff);border-radius:5px}
.bar em{font-style:normal;font-family:var(--mono);font-size:12px;text-align:right}
.tx{display:flex;flex-direction:column;gap:7px;max-height:62vh;overflow:auto}
.m{padding:8px 11px;border-radius:12px;max-width:78%}.m.Disha{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
.m.Seller{background:var(--sel);align-self:flex-end;border-bottom-right-radius:4px}.m small{display:block;color:var(--mute);font-size:11px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:r 1s linear infinite;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:.25}}

/* ---- call stage ---- */
.stage{position:relative;overflow:hidden;border-radius:18px;color:#e9ecff;min-height:560px;
  background:radial-gradient(1200px 500px at 30% 20%,#2a2370 0%,transparent 60%),radial-gradient(900px 500px at 90% 90%,#0e3a5c 0%,transparent 60%),linear-gradient(135deg,var(--stage1),var(--stage2));
  display:flex;flex-direction:column;padding:16px 18px}
.st-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:#9aa3b6}
.stage.live .pill i{background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.7);animation:pulse 1.6s infinite}
.stage.ringing .pill i,.stage.connecting .pill i{background:#ffb547;animation:blink 1s infinite}.stage.ended .pill i{background:#e5484d}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.timer{font:600 15px var(--mono);letter-spacing:.04em;opacity:.9}
.schips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.schip{padding:3px 10px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:12px;transition:background .4s,border-color .4s}
.schip b{font-weight:600;opacity:.65;margin-right:5px}.schip.flash{background:rgba(125,155,255,.45);border-color:#9fb4ff}
.st-mid{flex:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0 4px}
.party{display:flex;flex-direction:column;align-items:center;gap:4px}.party canvas{display:block;max-width:100%}
.party .nm{font-weight:700;font-size:16px}.party .sb{font-size:12px;opacity:.65}
.turn{text-align:center;min-width:170px}.turn .lbl{font-size:13px;opacity:.85;margin-bottom:8px;height:18px}
.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:22px}
.wave span{width:4px;height:6px;border-radius:2px;background:rgba(255,255,255,.35);transition:height .08s}
.captions{min-height:78px;text-align:center;padding:4px 30px}
.cap{font-size:17px;line-height:1.45;animation:fade .35s ease}.cap.old{font-size:14px;opacity:.5}.cap small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.6}
.cap.Disha small{color:#a9b8ff}.cap.Seller small{color:#8fe3a9}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tl{margin-top:8px}.tl-h{display:flex;justify-content:space-between;font-size:11px;opacity:.65;margin-bottom:6px}
.tl-track{position:relative;height:30px}.tl-line{position:absolute;left:0;right:0;top:14px;height:2px;background:rgba(255,255,255,.14);border-radius:2px}
.tl-fill{position:absolute;left:0;top:14px;height:2px;background:linear-gradient(90deg,#6d5dfc,#3ab0ff);border-radius:2px;width:0}
.mk{position:absolute;top:5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;display:grid;place-items:center;font:700 10px system-ui;color:#10131a;
  cursor:default;animation:pop .45s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.mk.log{opacity:.85;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.mk .tip{display:none;position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:240px;padding:8px 10px;border-radius:8px;background:#0b0f20;color:#e9ecff;
  font:12px/1.4 system-ui;text-align:left;box-shadow:0 6px 24px rgba(0,0,0,.4);z-index:3}
.mk:hover .tip{display:block}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;opacity:.7;margin-top:4px}.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:4px}
.toast{position:absolute;top:58px;left:50%;transform:translate(-50%,-20px);opacity:0;pointer-events:none;transition:all .35s;
  background:rgba(12,16,36,.92);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 14px;max-width:min(560px,90%);z-index:4;font-size:13px}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast b{text-transform:uppercase;letter-spacing:.05em}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(380px,92%);background:rgba(10,13,30,.96);transform:translateX(102%);transition:transform .3s;z-index:5;
  display:flex;flex-direction:column;padding:14px}
.drawer.open{transform:none}.drawer .tx{max-height:none;flex:1}.drawer .m{color:#e9ecff}.drawer .m.Disha{background:rgba(125,155,255,.18)}.drawer .m.Seller{background:rgba(61,220,132,.14)}
.drawer .m small{color:rgba(233,236,255,.6)}
.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#e9ecff}.ghost:hover:not(:disabled){border-color:#9fb4ff}
.outcome{position:absolute;inset:0;display:none;place-items:center;background:rgba(8,10,24,.55);backdrop-filter:blur(3px);z-index:4}
.outcome.show{display:grid}.oc{background:rgba(16,20,44,.97);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:22px 24px;width:min(520px,92%);animation:fade .4s}
.badge{display:inline-block;padding:5px 14px;border-radius:20px;font-weight:700;letter-spacing:.03em;font-size:14px}
.oc .kv{grid-template-columns:120px 1fr;margin:14px 0}.oc .kv>div:nth-child(odd){color:rgba(233,236,255,.6)}
.idle-msg{opacity:.7;text-align:center;font-size:13px}
.st-err{color:#ff9b94}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.st-mid{grid-template-columns:1fr;justify-items:center}.turn{order:3}}
@media (max-width:760px){.wrap{grid-template-columns:1fr;height:auto}aside.list{max-height:38vh}.kv{grid-template-columns:1fr}main{padding:14px 16px}}
</style>
</head>
<body>
<header><div class="logo"></div><div><h1>Disha Console</h1><div class="sub">Seller data → Jev → Disha → Call → Output → Fix loop </div></div>
<div class="right"><span id="hdr">Disha Voice Agent · Samvaad</span><button class="flowbtn" id="insbtn" title="What Disha learned from reviewed calls">◆ Insights</button><button class="flowbtn" id="flowbtn" title="See how a Disha call works, step by step">▶ Flow</button></div></header>
<div class="insov" id="insov" hidden><div class="inspanel"><div class="insh"><h2>Insights from reviewed calls</h2><button id="insrev" title="Review Disha's recent calls that have no review yet">Review recent calls</button><button id="insx">✕ Close</button></div><div id="insbody"></div></div></div>
<div class="flowov" id="flowov" hidden><button class="flowx" id="flowx" aria-label="Close the flow">✕ Close</button><iframe id="flowfr" title="How a Disha call works"></iframe></div>
<div class="wrap">
<aside class="list">
  <div class="tools"><input id="q" placeholder="Filter, or type a seller id…"><button id="lk" title="Build a profile for any seller id">Look up</button></div>
  <div id="list"></div>
</aside>
<main id="main"><div class="empty">Pick a seller on the left.</div></main>
</div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const J=o=>esc(JSON.stringify(o,null,2));
const UC_COL={free_to_paid:'#3a5bd9',reactivation:'#c2410c',profile_onboarding:'#0f766e',warm_followup:'#7c3aed',lead_engagement:'#b45309',discovery:'#64748b'};
const SIG={rush:['#ffb547','R','Rush'],interest:['#3ddc84','I','Interest'],confusion:['#ffe066','C','Confusion'],frustration:['#ff6b6b','F','Frustration'],
  language:['#5ab8ff','L','Language'],bot_question:['#c084fc','B','Bot question']};
const sig=s=>SIG[s]||['#cbd5e1','?',s||'switch'];
const nice=s=>String(s||'').replace(/_/g,' ');
const initials=n=>(n||'?').replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
let sellers=[], cur=null, es=null, pvCache={}, C=null;
async function api(u,o){const r=await fetch(u,o);if(!r.ok){let t=await r.text();try{t=JSON.parse(t).detail||t}catch(e){}throw new Error(t)}return r.json()}
async function load(){sellers=await api('/api/sellers');render()}
function render(){
  const q=$('#q').value.toLowerCase();let h='',g='';
  for(const s of sellers.filter(s=>!q||(s.company||'').toLowerCase().includes(q)||s.seller_id.includes(q)||(s.label||'').toLowerCase().includes(q))){
    if(s.group!==g){g=s.group;h+=`<div class="grp">${esc(g)}</div>`}
    h+=`<div class="s ${cur&&cur.seller_id===s.seller_id?'on':''}" data-id="${s.seller_id}"><div class="av" style="background:${UC_COL[s.use_case]||'#64748b'}">${esc(initials(s.company))}</div>
    <div><b>${esc(s.company||'(no name)')}</b><small>${esc(s.seller_id)} · ${esc([s.city,s.state].filter(Boolean).join(', '))}</small><br>
    <span class="chip">${esc(nice(s.use_case||'?'))}</span><span class="chip ${esc(s.contact_policy)}">${esc(nice(s.contact_policy||''))}</span></div></div>`}
  $('#list').innerHTML=h||'<div class="grp">No match. Type a seller id and press Look up.</div>';
  document.querySelectorAll('.s').forEach(e=>e.onclick=()=>open(e.dataset.id))}
$('#q').oninput=render;
$('#lk').onclick=async()=>{const id=$('#q').value.trim();if(!/^\d+$/.test(id))return alert('Type a numeric seller id');
  $('#lk').disabled=true;try{await api('/api/lookup/'+id,{method:'POST'});await load();open(id)}catch(e){alert(e.message)}$('#lk').disabled=false};

const contactIn=()=>({name:$('#cname')?.value.trim()||'',phone:$('#cphone')?.value.trim()||''});
const useLearned=()=>$('#uselearn')?$('#uselearn').checked:true;
const OVL={use_case:v=>'purpose → '+nice(v),start_language:v=>'start in '+({'hi-IN':'Hindi','en-IN':'English','ta-IN':'Tamil','bn-IN':'Bengali','gu-IN':'Gujarati','kn-IN':'Kannada','ml-IN':'Malayalam','mr-IN':'Marathi','od-IN':'Odia','pa-IN':'Punjabi','te-IN':'Telugu'}[v]||v),
  pace_delta:v=>'pace '+(v>0?'+':'')+v,nudge_budget:v=>'max '+v+' nudge'+(v==1?'':'s'),simpler:()=>'simpler wording',notes:v=>v.length+' note'+(v.length>1?'s':'')};
function ovChips(ov){return Object.entries(ov||{}).filter(([k])=>OVL[k]).map(([k,v])=>`<span class="chip">${esc(OVL[k](v))}</span>`).join('')}
async function loadLearned(id){const el=$('#learnbox');if(!el)return;let L;try{L=await api('/api/learned/'+id)}catch(e){return}
  const ov=L.applied||{};if(!Object.keys(ov).length){el.innerHTML='';return}
  el.innerHTML=`<div class="learn"><h4>Learned from earlier calls</h4><div class="chips">${ovChips(ov)}</div>
   ${(ov.notes||[]).map(n=>`<div><small>• ${esc(n)}</small></div>`).join('')}
   <small>${esc(ov.why||'')}</small>${(L.rules||[]).length?`<div><small>Approved rules: ${esc(L.rules.join(' | '))}</small></div>`:''}
   <div style="display:flex;gap:10px;align-items:center;margin-top:6px"><label style="font-size:13px"><input type="checkbox" id="uselearn" checked> Apply on the next call</label>
   ${Object.keys(L.own||{}).length?'<button id="clrlearn" style="padding:3px 10px;font-size:12px">Forget this seller\'s fixes</button>':''}</div></div>`;
  $('#clrlearn')&&($('#clrlearn').onclick=async()=>{await api('/api/learned/'+id,{method:'DELETE'});loadLearned(id)})}
const BLOCK={SUPPRESS:'Do not call: this seller asked IndiaMART not to call them again. Calls are blocked.',
  ROUTE_TO_HUMAN:'Executive only: this seller should be handled by an IndiaMART executive, not the bot. Calls are blocked.'};
function blocked(pol){return BLOCK[pol]?`<div class="blockbox"><b>${esc(BLOCK[pol])}</b>
  <label><input type="checkbox" id="allowblk"> Allow one test call anyway (Disha will only say the call was a mistake and close)</label></div>`:''}
const TABS=['Seller data','Sent to Jev','Sent to Disha','Call','Call output'];
async function open(id){
  if(C&&C.active&&!confirm('A call is running. Switch seller anyway? (the call keeps running)'))return;
  cur=await api('/api/seller/'+id);render();
  const p=cur.profile_obj,gen=p.gen||{},r=p.rules||{};
  $('#main').innerHTML=`<div class="hero"><div class="av" style="background:${UC_COL[r.use_case]||'#64748b'}">${esc(initials(cur.company))}</div>
   <div><h2>${esc(cur.company||'(no name)')}</h2><div class="sub">${esc(cur.seller_id)} · ${esc([cur.city,cur.state].filter(Boolean).join(', '))} · ${esc(cur.label||'')}</div>
   <span class="chip">${esc(nice(r.use_case))}</span><span class="chip ${esc(r.contact_policy)}">${esc(nice(r.contact_policy))}</span>
   ${blocked(r.contact_policy)}
   <div id="learnbox"></div>
   <div class="contact"><input id="cname" placeholder="Contact name (optional)" aria-label="Contact name"><input id="cphone" placeholder="Phone (optional)" aria-label="Contact phone"></div></div>
   <div class="act"><button id="pv">Run Jev + preview</button><button class="pri" id="cl" title="Talk to Disha in this browser (echo-cancelled mic; headphones best)">● Call in browser</button>
   <button class="pri" id="cp">☎ Call my phone</button><button class="danger" id="hu" disabled>Hang up</button></div></div>

let raf=0;
function lvl(an,buf){if(!an)return 0;an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];return Math.sqrt(s/buf.length)}

  if(C){C.dl=C.dl*0.75+dl*0.25;C.sl=C.sl*0.75+sl*0.25}
  const D=C?C.dl:0,S=C?C.sl:0,ringing=ph.includes('ringing')||ph.includes('connecting'),live=ph.includes('live'),phone=C&&C.mode==='phone';

  const bars=72;for(let i=0;i<bars;i++){const ang=i/bars*Math.PI*2-Math.PI/2;
    const q=i%18,k=q<9?q:17-q;let v=freq?freq[3+k*4]/255:0;  // 4 mirrored copies of the voice band: an even ring
    if(!freq||phone)v=live||phone&&!ringing?0.12+0.08*Math.sin(now*2.2+i*0.5):0.05;
    v=Math.min(1,v*(freq&&!phone?1.25:1));const r1=R+10,r2=r1+6+v*W*0.17;

  const gr=g.createRadialGradient(cx-br*0.3,cx-br*0.3,br*0.1,cx,cx,br);gr.addColorStop(0,'#b9c3ff');gr.addColorStop(0.55,'#6d5dfc');gr.addColorStop(1,'#3a2fb8');
  g.shadowColor='rgba(120,110,255,.9)';g.shadowBlur=20+glow*45;g.beginPath();g.arc(cx,cx,br,0,7);g.fillStyle=gr;g.fill();g.shadowBlur=0;
  g.fillStyle='rgba(255,255,255,.92)';g.font=`700 ${W*0.09}px system-ui`;g.textAlign='center';g.textBaseline='middle';g.fillText('D',cx,cx+1);
  // seller orb

  const gs=g.createRadialGradient(cx-R*0.3,cx-R*0.3,R*0.1,cx,cx,R);gs.addColorStop(0,'#bff3d1');gs.addColorStop(1,phone?'#1e7a52':'#1f8f5c');
  g.beginPath();g.arc(cx,cx,R*(1+sv*0.08),0,7);g.fillStyle=gs;g.fill();
  g.fillStyle='rgba(255,255,255,.95)';g.font=`700 ${W*0.13}px system-ui`;g.textAlign='center';g.textBaseline='middle';g.fillText(phone?'☎':initials(cur?.company).slice(0,2),cx,cx+1);
  // turn label + mini wave
  if(C&&C.active){let who='',lab='';

// ---------------- browser audio: echo-cancelled mic -> 20 ms PCM16 @16 kHz -> local websocket; agent audio played gaplessly
const WORKLET=`class Cap extends AudioWorkletProcessor{constructor(){super();this.r=sampleRate/16000;this.p=0;this.b=new Int16Array(320);this.n=0}
process(i){const x=i[0]&&i[0][0];if(!x)return true;for(;this.p<x.length;this.p+=this.r){const v=Math.max(-1,Math.min(1,x[Math.floor(this.p)]));
this.b[this.n++]=v<0?v*32768:v*32767;if(this.n===320){this.port.postMessage(this.b.buffer,[this.b.buffer]);this.b=new Int16Array(320);this.n=0}}
this.p-=x.length;return true}}registerProcessor('cap',Cap)`;
let au=null;
async function audioStart(sid){
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
  const ctx=new AudioContext({latencyHint:'interactive'});await ctx.resume();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET],{type:'application/javascript'})));
  const src=ctx.createMediaStreamSource(stream),node=new AudioWorkletNode(ctx,'cap');src.connect(node);
  const micAn=ctx.createAnalyser();micAn.fftSize=1024;src.connect(micAn);
  const out=ctx.createGain(),outAn=ctx.createAnalyser();outAn.fftSize=256;outAn.smoothingTimeConstant=0.7;out.connect(outAn);out.connect(ctx.destination);
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/audio/'+sid);ws.binaryType='arraybuffer';
  au={ctx,stream,node,ws,out,outAn,micAn,next:0,srcs:new Set(),tbuf:new Float32Array(256),tbuf2:new Float32Array(1024),fbuf:new Uint8Array(128)};
  node.port.onmessage=e=>{if(ws.readyState===1)ws.send(e.data)};
  ws.onmessage=e=>{
    if(typeof e.data==='string'){const m=JSON.parse(e.data);if(m.type==='interrupt')audioFlush();if(m.type==='end')audioStop();return}
    const sr=new DataView(e.data).getUint32(0,true),pcm=new Int16Array(e.data,4);if(!pcm.length||!au)return;
    const buf=ctx.createBuffer(1,pcm.length,sr),ch=buf.getChannelData(0);for(let i=0;i<pcm.length;i++)ch[i]=pcm[i]/32768;
    const s=ctx.createBufferSource();s.buffer=buf;s.connect(out);
    const t=Math.max(ctx.currentTime+0.02,au.next);s.start(t);au.next=t+buf.duration;au.srcs.add(s);s.onended=()=>au&&au.srcs.delete(s)};
  ws.onclose=()=>audioStop();
}
function audioFlush(){if(!au)return;for(const s of au.srcs){try{s.stop()}catch(e){}}au.srcs.clear();au.next=0}
function audioStop(){if(!au)return;const a=au;au=null;for(const s of a.srcs){try{s.stop()}catch(e){}}
  try{a.ws.close()}catch(e){}a.stream.getTracks().forEach(t=>t.stop());a.ctx.close().catch(()=>{})}

async function call(mode){
  if(mode==='phone'&&!confirm('Place a real call to your verified test number (spends Samvaad credits)?'))return;
  if(mode==='laptop'&&!navigator.mediaDevices)return alert('The microphone needs http://localhost (not an IP address).');
  let r;try{r=await api('/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seller_id:cur.seller_id,mode,contact:contactIn(),use_learned:useLearned(),allow_blocked:!!$('#allowblk')?.checked})})}catch(e){return alert(e.message)}
  $('#p3').innerHTML=stageHTML(mode);wireStage();
  C={sid:r.session_id,mode,active:true,t0:performance.now(),el(){return ((this.tEnd||performance.now())-this.t0)/1000},marks:[],dl:0,sl:0,live:[]};
  stageChips(pvCache[cur.seller_id]?chipsFromPreview(pvCache[cur.seller_id]):{});
  setPhase(mode==='phone'?'connecting':'connecting',mode==='phone'?'Placing call':'Connecting');tab(3);drawOnce();
  document.querySelector('.tabs button[data-t="3"]').classList.add('liveon');
  if(mode==='laptop'){try{await audioStart(r.session_id)}catch(e){api('/api/hangup',{method:'POST'});setPhase('ended','Mic blocked');return alert('Microphone: '+e.message)}}

  if(es)es.close();es=new EventSource('/api/events/'+r.session_id);

    if(ev.kind==='status'){

      else if(d.phase==='ended'){C.tEnd=C.tEnd||performance.now();setPhase('ended','Call ended');C.endText=d.text||C.endText}
      if(d.interaction_id)$('#hdr').textContent='interaction '+d.interaction_id}
    if(ev.kind==='connected'){stageChips({use_case:d.use_case,confidence:d.confidence,style:d.style,pace:d.pace,language:d.language,history:d.history,learned:(d.learned||[]).length,nudges:d.nudge_budget});
      ['uc','st','pc','lg'].forEach(x=>flashChip(x))}
    if(ev.kind==='transcript')caption(d.who,d.text);
    if(ev.kind==='switch'){addMarker(d,false);toast(d);C.live.push(d)}
    if(ev.kind==='language')flashChip('lg',d.language);
    if(ev.kind==='output'){showOutput(d);loadLearned(cur.seller_id)}
    if(ev.kind==='ended')finish()};
}
async function hangup(){$('#hu').disabled=true;await api('/api/hangup',{method:'POST'}).catch(()=>{})}
function finish(){audioStop();if(C){C.active=false;C.tEnd=C.tEnd||performance.now()}
  $('#hu').disabled=true;$('#cl').disabled=$('#cp').disabled=false;es&&es.close();
  document.querySelector('.tabs button[data-t="3"]')?.classList.remove('liveon');
  const s=$('#stage');if(s&&!s.className.includes('ended'))setPhase('ended','Call ended');
  const t=$('#turn');if(t&&t.textContent.startsWith('Fetching'))t.textContent='Call ended'}
const DISPO={meeting_scheduled:['Meeting booked','#3ddc84'],callback_requested:['Callback requested','#ffb547'],declined:['Declined','#ff6b6b'],
  not_interested:['Not interested','#ff6b6b'],no_answer:['No answer','#9aa3b6'],dnc_requested:['Do not call','#ff6b6b']};
const FIXL={nudge_budget:'Nudge budget',use_case:'Purpose',start_language:'Start language',pace_delta:'Pace',simpler:'Wording',note:'Note'};
function reviewCard(rv,nx){
  if(!rv||!rv.status)return '';
  if(rv.status!=='reviewed')return `<div class="card"><h3>Call review (fix loop)</h3><span style="color:var(--mute)">${esc(rv.status)}: ${esc(rv.why||'')}</span></div>`;
  const c1=rv.call_1||{},p=rv.persona||{};
  const bar=(k,lab)=>p[k]==null?'':`<div class="bar"><span>${lab}</span><div class="tr"><i style="width:${Math.round(p[k]*100)}%"></i></div><em>${(+p[k]).toFixed(2)}</em></div>`;
  return `<div class="card"><h3>Call review (fix loop) · ${rv.source==='console'?'reviewed by the console':'reviewed on Samvaad'}</h3>
   <div class="grid2"><div><div class="kv"><div>Call 1 chose</div><div>${esc(nice(c1.use_case))} · ${esc(c1.use_case_confidence||'')}</div>
     <div>In hindsight</div><div><b>${esc(nice(rv.hindsight_use_case))}</b> (${rv.hindsight_confidence??'?'}) <span class="tag ${rv.agrees?'ok':'warn'}">${rv.agrees?'Call 1 was right':'Call 1 was off'}</span></div>
     ${rv.nudges?`<div>Nudges</div><div>${rv.nudges.used} used of ${rv.nudges.budget??'?'} allowed · ${rv.nudges.refusals} refusal(s) ${rv.nudges.over_budget?'<span class="tag warn">over budget</span>':'<span class="tag ok">within budget</span>'}</div>`:''}
     <div>Seller's language</div><div>${esc(rv.seller_language||'?')} (${rv.seller_language_confidence??'?'}) · Call 1 started in ${esc(c1.start_language||'?')}</div>
     ${(c1.learned_overrides||[]).length?`<div>Already applied</div><div>${c1.learned_overrides.map(esc).join(' · ')}</div>`:''}</div></div>
     <div>${bar('goal_met','Goal met')}${bar('persona_fit','Persona fit')}${bar('opening_ok','Opening landed')}${bar('wanted_faster','Wanted faster')}${bar('wanted_slower','Wanted slower')}${bar('wanted_simpler','Was confused')}${bar('irritated_by_push','Irritated by pushing')}</div></div>
   <h3 style="margin-top:12px">Fixes</h3>${(rv.fixes||[]).map(f=>`<div class="fix"><span class="tag ${f.auto?'ok':'warn'}">${f.auto?'applied next call':'suggestion'}</span>
     <span><b>${esc(FIXL[f.kind]||f.kind)}</b>: ${esc(typeof f.value==='boolean'?'simpler':String(f.value))} <small style="color:var(--mute)">· ${esc(f.why)} (${f.probability})</small></span></div>`).join('')||'<span style="color:var(--mute)">No fixes needed.</span>'}
   ${Object.keys(nx).length?`<div class="learn"><h4>This seller's next call will use</h4><div class="chips">${ovChips(nx)}</div></div>`:''}</div>`}
function showOutput(d){
  const o=d.output||{},m=d.meta||{},sl=o.switch_log_json||{},sw=sl.switches||(Array.isArray(sl)?sl:[]);
  const [dl,dc]=d.pending?['Still processing on Samvaad','#ffb547']:DISPO[o.disposition]||[nice(o.disposition)||'No outcome recorded','#9aa3b6'];
  const refresh=d.pending&&d.interaction_id?`<p style="margin:10px 0 0;opacity:.8">Samvaad has not published this call's record yet. It usually appears within a minute or two.</p>
    <button class="pri" style="margin-top:10px" onclick="refreshOutput('${esc(d.interaction_id)}',this)">Refresh outcome</button>`:'';
  const meet=[o.meeting_date,o.meeting_time].filter(Boolean).join(' · ');
  const rv=d.review||o.call_review||{},nx=d.next_call||{};
  const rvLine=rv.status==='reviewed'?(rv.agrees?`Review: Call 1 picked the right purpose (${esc(nice(rv.hindsight_use_case))})`:`Review: better purpose was ${esc(nice(rv.hindsight_use_case))} (Call 1: ${esc(nice((rv.call_1||{}).use_case))})`)
    +((rv.fixes||[]).filter(f=>f.auto).length?` · ${(rv.fixes||[]).filter(f=>f.auto).length} fix(es) for the next call`:''):rv.status?`Review ${esc(rv.status)}: ${esc(rv.why||'')}`:'';
  // stage: tidy up live view, add switch-log markers the live stream did not show, then the outcome card
  if(C){if(m.duration_in_seconds&&!C.live.length)C.tEnd=C.t0+m.duration_in_seconds*1000;
    const liveSig=new Set(C.live.map(x=>x.signal+'|'+Math.round(x.t_sec/5)));
    sw.forEach(x=>{if(C.live.length&&liveSig.size&&C.live.some(l=>l.signal===x.signal))return;addMarker(x,true)});
    const oc=$('#oc');if(oc){oc.innerHTML=`<div class="oc"><div style="opacity:.7;font-size:12px;letter-spacing:.06em;text-transform:uppercase">Call outcome</div>
      <div style="margin-top:8px"><span class="badge" style="background:${dc}22;color:${dc};border:1px solid ${dc}66">${esc(dl)}</span></div>
      ${refresh}<div class="kv"><div>Meeting</div><div>${esc(meet||'—')}</div><div>Summary</div><div>${esc(o.call_summary||'—')}</div>
      <div>Duration</div><div>${m.duration_in_seconds?fmt(m.duration_in_seconds):'—'} · ${esc(m.language_name||'')}</div><div>Switches</div><div>${sw.length} logged</div><div>Review</div><div>${rvLine||'—'}</div></div>
      <div style="display:flex;gap:8px"><button class="pri" id="ocfull">Full output</button><button class="ghost" id="occlose">Back to call view</button></div></div>`;
      oc.classList.add('show');$('#ocfull').onclick=()=>tab(4);$('#occlose').onclick=()=>oc.classList.remove('show')}}
  $('#p4').innerHTML=`<div class="grid2"><div class="card"><h3>Outcome</h3><span class="badge" style="background:${dc}22;color:${dc};border:1px solid ${dc}66">${esc(dl)}</span>${refresh}
    <div class="kv" style="margin-top:12px"><div>Meeting</div><div>${esc(meet||'—')}</div><div>Summary</div><div>${esc(o.call_summary||'—')}</div>
    <div>Seller notes</div><div>${esc(o.seller_notes||'—')}</div><div>Use case</div><div>${esc(nice(o.use_case))} · ${esc(o.use_case_confidence)}</div>
    <div>Persona style</div><div>${esc(nice(o.persona_style))}</div>
    <div>Duration</div><div>${m.duration_in_seconds?fmt(m.duration_in_seconds):'—'} · ${esc(m.language_name||'')} · ended by ${esc(nice(m.ended_by)||'?')}</div>
    <div>Interaction</div><div style="font-family:var(--mono);font-size:12px">${esc(m.interaction_id||'—')}</div><div>Saved</div><div style="font-family:var(--mono);font-size:12px">${esc(d.saved||'')}</div></div></div>
    <div class="card"><h3>Persona switches · ${sw.length}</h3>${sw.map(s=>{const [c,,n]=sig(s.signal);const vs=s.verified_signal;
      return `<div style="border-left:3px solid ${c};padding:4px 10px;margin:8px 0"><b>${esc(n)}</b> <span style="color:var(--mute)">at ${fmt(s.t_sec||0)}</span>${s.change?' · '+esc(s.change):''}
      <br><small style="color:var(--mute)">${s.seller_words?'“'+esc(s.seller_words)+'”':''}${s.reason?' · '+esc(s.reason):''}</small>
      ${vs!=null?`<div class="bar" style="grid-template-columns:110px 1fr 50px;margin:4px 0 0"><span style="font-size:12px">Jev confirms</span><div class="tr"><i style="width:${Math.round(vs*100)}%"></i></div><em>${(+vs).toFixed(2)}</em></div>`:''}</div>`}).join('')||'<div style="color:var(--mute)">No switches logged.</div>'}
      <details><summary>switch_log_json</summary><pre>${J(sl)}</pre></details></div></div>
    ${reviewCard(rv,nx)}
    <div class="card"><h3>Transcript (Samvaad)</h3><div class="tx">${(d.transcript||[]).map(t=>{const w=t.role==='assistant'?'Disha':'Seller';return `<div class="m ${w}"><small>${w}</small>${esc(t.content)}</div>`}).join('')||'<div style="color:var(--mute)">No transcript.</div>'}</div></div>
    <details class="card"><summary>All output variables</summary><pre>${J(o)}</pre></details>`}
async function showInsights(d){
  d=d||await api('/api/insights');const sm=d.summary||{};
  $('#insbody').innerHTML=`<div class="stats">
    <div class="stat"><b>${sm.reviewed_calls||0}</b><span>calls reviewed (${sm.sellers||0} sellers)</span></div>
    <div class="stat"><b>${sm.call1_judged?sm.call1_right+' / '+sm.call1_judged:'—'}</b><span>Call 1 picked the right purpose</span></div>
    <div class="stat"><b>${sm.goal_met??'—'}</b><span>average goal met</span></div>
    <div class="stat"><b>${sm.persona_fit??'—'}</b><span>average persona fit</span></div>
    <div class="stat"><b>${sm.sellers_with_fixes||0}</b><span>sellers with fixes for their next call</span></div>
    <div class="stat"><b>${sm.nudge_judged?(sm.nudge_judged-sm.nudge_over_budget)+' / '+sm.nudge_judged:'—'}</b><span>calls within their nudge budget</span></div></div>
   <div class="card"><h3>Suggested rules for all sellers · approve to apply</h3>${(d.suggestions||[]).map(s=>`<div class="sugg ${s.status}">
     <div>${esc(s.text)}</div><div class="row"><span class="tag">${s.matching} of ${s.calls} calls</span>${s.low_evidence?'<span class="tag warn">few calls so far</span>':''}
     <span class="tag">${esc(Object.entries(s.when||{}).map(([k,v])=>k+': '+v).join(', ')||'all sellers')}</span><span class="chips">${ovChips(s.overrides)}</span>
     <span style="margin-left:auto;display:flex;gap:6px">${s.status==='suggested'?`<button class="pri" data-r="${s.id}" data-a="approved">Approve</button><button data-r="${s.id}" data-a="dismissed">Dismiss</button>`:
       `<span class="tag ${s.status==='approved'?'ok':''}">${s.status}</span><button data-r="${s.id}" data-a="reset">Undo</button>`}</span></div></div>`).join('')||'<span style="color:var(--mute)">No patterns yet: a rule needs at least 2 reviewed calls pointing the same way.</span>'}</div>
   <div class="card"><h3>Recently reviewed calls</h3><table style="width:100%;font-size:13px;border-collapse:collapse">${(d.recent||[]).map(r=>`<tr style="border-top:1px solid var(--line)">
     <td style="padding:5px">${esc(r.company)}</td><td>${esc(r.at||'')}</td><td>Call 1: ${esc(nice(r.call1))}</td><td>Hindsight: ${esc(nice(r.hindsight))}</td>
     <td><span class="tag ${r.agrees?'ok':'warn'}">${r.agrees?'right':'off'}</span></td><td>${esc((r.fixes||[]).map(f=>FIXL[f]||f).join(', ')||'—')}</td><td style="color:var(--mute)">${esc(r.source)}</td></tr>`).join('')}</table></div>`;
  document.querySelectorAll('#insbody button[data-r]').forEach(b=>b.onclick=async()=>{b.disabled=true;showInsights(await api(`/api/insights/${b.dataset.r}/${b.dataset.a}`,{method:'POST'}));if(cur)loadLearned(cur.seller_id)})}
$('#insbtn').onclick=()=>{$('#insov').hidden=false;$('#insbody').innerHTML='<span class="spin"></span> loading…';showInsights()};
$('#insx').onclick=()=>{$('#insov').hidden=true};
$('#insov').onclick=e=>{if(e.target.id==='insov')$('#insov').hidden=true};
$('#insrev').onclick=async()=>{const b=$('#insrev');b.disabled=true;b.innerHTML='<span class="spin"></span> Reviewing…';
  try{const r=await api('/api/review/recent',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"days":3}'});b.textContent=`Reviewed ${r.reviewed} new call(s)`;showInsights()}
  catch(e){b.textContent='Review recent calls';alert(e.message)}setTimeout(()=>{b.disabled=false;b.textContent='Review recent calls'},4000)};
$('#flowbtn').onclick=()=>{if(!$('#flowfr').src.endsWith('/flow'))$('#flowfr').src='/flow';else $('#flowfr').contentWindow.location.reload();$('#flowov').hidden=false};
$('#flowx').onclick=()=>{$('#flowov').hidden=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#flowov').hidden=true;$('#insov').hidden=true}});
async function refreshOutput(iid,btn){btn.disabled=true;btn.textContent='Checking Samvaad…';
  try{const d=await api('/api/output/'+iid);d.interaction_id=d.interaction_id||iid;if(C)C.marks=[],document.querySelectorAll('#tlm .mk').forEach(m=>m.remove());showOutput(d)}
  catch(e){btn.disabled=false;btn.textContent='Refresh outcome';alert('Could not read the call record: '+e.message)}}
load().then(()=>{const u=new URLSearchParams(location.search);if(u.get('seller'))open(u.get('seller'))});
</script>
